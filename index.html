
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Energy Sector Resilience</title>
    <meta name="description" content="Explore GB energy infrastructure, live grid data and disruption scenarios." />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Custom Scrollbar for dark theme */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a; 
      }
      ::-webkit-scrollbar-thumb {
        background: #334155; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569; 
      }
      .neon-glow {
        box-shadow: 0 0 10px rgba(34, 211, 238, 0.5);
      }
      /* Leaflet Customization */
      .leaflet-container {
        background-color: #0f172a !important;
        font-family: inherit;
      }
      .leaflet-popup-content-wrapper, .leaflet-popup-tip {
        background: #1e293b;
        color: #f8fafc;
        border: 1px solid #334155;
        border-radius: 0.5rem;
      }
      .leaflet-popup-content {
        margin: 0;
        padding: 0;
      }
      /* Pulsing Marker for Outages */
      /* Darken the grey basemap to match the app's slate theme */
      .basemap-tiles {
        filter: brightness(0.55) contrast(1.1);
      }
      .asset-icon {
        background: transparent;
        border: none;
      }
      .leaflet-control-attribution {
        background: rgba(15, 23, 42, 0.8) !important;
        color: #64748b !important;
      }
      .leaflet-control-attribution a { color: #94a3b8 !important; }
      .outage-icon {
        background: transparent;
        border: none;
      }
      .outage-dot {
        width: 16px;
        height: 16px;
        background-color: #ef4444;
        border: 2px solid white;
        border-radius: 50%;
        position: relative;
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 1);
        animation: pulse-red 2s infinite;
      }
      @keyframes pulse-red {
        0% {
          transform: scale(0.95);
          box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
        }
        70% {
          transform: scale(1);
          box-shadow: 0 0 0 10px rgba(239, 68, 68, 0);
        }
        100% {
          transform: scale(0.95);
          box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
        }
      }
      
      /* Generation Unit Status Indicators */
      .gen-marker {
        transition: all 0.3s ease;
      }
      .gen-active-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 2px solid white;
        background-color: #22c55e; /* Green-500 */
        box-shadow: 0 0 10px #22c55e;
        animation: blink-green 3s infinite ease-in-out;
      }
      .gen-standby-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        border: 1px solid #94a3b8;
        background-color: #475569; /* Slate-600 */
      }
      @keyframes blink-green {
        0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 5px #22c55e; }
        50% { opacity: 0.6; transform: scale(0.9); box-shadow: 0 0 2px #22c55e; }
      }
    </style>
</head>
  <body class="bg-slate-950 text-slate-100">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>

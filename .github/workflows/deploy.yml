name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'   # every Monday 03:17 UTC: refresh the OpenStreetMap snapshot, GSP areas and DNO lines

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install

      # ---- Energy map tiles: every OSM power and gas asset in the UK (rebuilt once a week) ----
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Week number
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Reuse this week's energy tiles if already built
        id: tiles
        uses: actions/cache@v4
        with:
          path: public/tiles
          key: energy-tiles-${{ steps.week.outputs.week }}-${{ hashFiles('scripts/energy-tiles.yml') }}
      - name: Build energy tiles from OpenStreetMap
        if: steps.tiles.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 60
        run: |
          curl -sSL -o planetiler.jar https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar
          java -Xmx12g -jar planetiler.jar generate-custom --schema=scripts/energy-tiles.yml --output=energy.pmtiles --download --force
          # Only publish (and cache) the tiles if the build succeeded
          mkdir -p public/tiles && mv energy.pmtiles public/tiles/ && ls -lh public/tiles

      - name: Build OpenStreetMap snapshot and connection registers
        run: node scripts/build-osm-snapshot.mjs
        continue-on-error: true
        env:
          # Optional free keys for two DNO connection registers (skipped if not set). Never shown on the site.
          SPEN_API_KEY: ${{ secrets.SPEN_API_KEY }}
          UKPN_API_KEY: ${{ secrets.UKPN_API_KEY }}
        timeout-minutes: 20

      # ---- Grid Supply Point areas (scenario map) and network operators' own 33 kV+ lines (weekly) ----
      - name: Install GDAL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin
        continue-on-error: true
      - name: Reuse this week's network operator lines if already built
        id: dnolines
        uses: actions/cache@v4
        with:
          path: |
            public/network
            public/data/dno-lines-sources.json
          key: dno-lines-${{ steps.week.outputs.week }}-${{ hashFiles('scripts/build-network-extras.mjs') }}
      - name: Build Grid Supply Point areas and network operator lines
        continue-on-error: true
        timeout-minutes: 30
        env:
          SPEN_API_KEY: ${{ secrets.SPEN_API_KEY }}
          UKPN_API_KEY: ${{ secrets.UKPN_API_KEY }}
        run: |
          if [ "${{ steps.dnolines.outputs.cache-hit }}" = "true" ]; then
            node scripts/build-network-extras.mjs gsp
          else
            node scripts/build-network-extras.mjs
          fi
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
